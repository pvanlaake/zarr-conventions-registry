name: Validate submission

on:
  pull_request:
    paths:
      - "submissions/**.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Find changed submission files
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'submissions/**.json' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Validate changed files against schema
        if: steps.changed.outputs.files != ''
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            echo "Validating $file..."
            ajv validate \
              -s schema/convention.schema.json \
              -d "$file" \
              -c ajv-formats \
              --strict=false
          done

      - name: Check filename matches UUID
        if: steps.changed.outputs.files != ''
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            UUID=$(basename "$file" .json)
            ENTRY_UUID=$(jq -r '.uuid' "$file")
            if [ "$UUID" != "$ENTRY_UUID" ]; then
              echo "ERROR: filename $UUID does not match uuid field $ENTRY_UUID in $file"
              exit 1
            fi
          done

      - name: Check no CDG-only fields set by submitter
        if: steps.changed.outputs.files != ''
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            if jq -e '.registered' "$file" > /dev/null 2>&1; then
              echo "ERROR: 'registered' field must not be set by submitter in $file"
              exit 1
            fi
            if jq -e '.status_changed' "$file" > /dev/null 2>&1; then
              echo "ERROR: 'status_changed' field must not be set by submitter in $file"
              exit 1
            fi
          done

      - name: Check UUID uniqueness across registry
        if: steps.changed.outputs.files != ''
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            UUID=$(jq -r '.uuid' "$file")
            EXISTING=$(grep -r "\"uuid\": \"$UUID\"" registry/ 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              echo "ERROR: UUID $UUID already exists in registry"
              exit 1
            fi
          done

      - name: Check namespace uniqueness across registry
        if: steps.changed.outputs.files != ''
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            NS=$(jq -r '.namespace' "$file")
            EXISTING=$(grep -r "\"namespace\": \"$NS\"" registry/ 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              echo "ERROR: namespace '$NS' already exists in registry"
              exit 1
            fi
          done
