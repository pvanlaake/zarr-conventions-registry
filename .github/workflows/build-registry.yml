name: Build registry

on:
  push:
    branches:
      - main
    paths:
      - "registry/**.json"
      - "submissions/**.json"
      - "docs/**.md"
      - "site/**"
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "submissions/**.json"

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  # ── Label and comment on new submission PRs ──────────────────────────────
  stage-submission:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get submission details
        id: details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          FILES=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
            | jq -r '.[] | select(.status == "added") | select(.filename | startswith("submissions/")) | select(.filename | endswith(".json")) | .filename')

          if [ -z "$FILES" ]; then
            echo "no_new=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Fetch the actual file content from the PR branch
          FILE=$(echo "$FILES" | head -1)
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/refs/pull/${PR_NUMBER}/head/${FILE}"
          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$RAW_URL" > /tmp/submission.json

          NAME=$(jq -r '.name' /tmp/submission.json)
          TITLE=$(jq -r '.title // ""' /tmp/submission.json)
          NAMESPACE_KEY=$(jq -r '.namespace.key // ""' /tmp/submission.json)
          MATURITY=$(jq -r '.maturity // "proposed"' /tmp/submission.json)
          REVIEW_END=$(date -u -d '+14 days' +%Y-%m-%d 2>/dev/null || date -u -v+14d +%Y-%m-%d)

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "namespace_key=$NAMESPACE_KEY" >> $GITHUB_OUTPUT
          echo "maturity=$MATURITY" >> $GITHUB_OUTPUT
          echo "review_end=$REVIEW_END" >> $GITHUB_OUTPUT

      - name: Add staged label
        if: steps.details.outputs.no_new != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Ensure label exists
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'staged',
                color: '0075ca',
                description: 'Convention submission under community review'
              });
            } catch (e) {
              // Label already exists, ignore
            }
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'modification',
                color: 'e4e669',
                description: 'Modification to an existing registry entry'
              });
            } catch (e) {}
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['staged']
            });

      - name: Post review period comment
        if: steps.details.outputs.no_new != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const name = '${{ steps.details.outputs.name }}';
            const title = '${{ steps.details.outputs.title }}';
            const key = '${{ steps.details.outputs.namespace_key }}';
            const maturity = '${{ steps.details.outputs.maturity }}';
            const reviewEnd = '${{ steps.details.outputs.review_end }}';
            const display = title ? `**${name}** — ${title}` : `**${name}**`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                `## 📋 Convention submission received`,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| Name | ${display} |`,
                `| Namespace | \`${key}\` |`,
                `| Maturity | ${maturity} |`,
                `| Review period ends | ${reviewEnd} |`,
                ``,
                `This submission has passed automated validation and is now open for **community review**.`,
                ``,
                `**Community members:** please review the convention specification and leave comments on this PR.`,
                ``,
                `**CDG:** this PR may be merged or closed with a reason after the review period ends on **${reviewEnd}**.`,
                ``,
                `> A submission may be rejected if it fails to meet the [registration criteria](https://github.com/${{ github.repository }}/blob/main/submissions/README.md).`
              ].join('\n')
            });

  build-staged-catalog:
    needs: [accept-submissions, stage-submission]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install ajv ajv-formats

      - name: Build staged catalog from open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const https = require('https');

          function ghFetch(path) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.github.com',
                path,
                headers: {
                  'Authorization': 'Bearer ' + process.env.GH_TOKEN,
                  'User-Agent': 'zarr-conventions-registry',
                  'Accept': 'application/vnd.github.v3+json'
                }
              };
              https.get(options, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(JSON.parse(data)));
              }).on('error', reject);
            });
          }

          function rawFetch(url) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              https.get({
                hostname: u.hostname,
                path: u.pathname + u.search,
                headers: {
                  'Authorization': 'Bearer ' + process.env.GH_TOKEN,
                  'User-Agent': 'zarr-conventions-registry',
                  'Accept': 'application/vnd.github.raw'
                }
              }, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          async function main() {
            const fs = require('fs');

            // Get open PRs with staged label
            const prs = await ghFetch('/repos/pvanlaake/zarr-conventions-registry/pulls?state=open&per_page=100');
            const staged = prs.filter(pr =>
              pr.labels && pr.labels.some(l => l.name === 'staged')
            );
            console.log('Found ' + staged.length + ' staged PRs');

            const entries = [];
            for (const pr of staged) {
              // Get files changed in this PR
              const files = await ghFetch('/repos/pvanlaake/zarr-conventions-registry/pulls/' + pr.number + '/files');
              const submissionFiles = files.filter(f =>
                f.filename.startsWith('submissions/') &&
                f.filename.endsWith('.json') &&
                f.status === 'added'
              );

              for (const file of submissionFiles) {
                try {
                  const content = await rawFetch(file.raw_url);
                  const entry = JSON.parse(content);
                  entry._pr_number = pr.number;
                  entry._pr_url = pr.html_url;
                  // Use PR creation date as submission date if not set
                  if (!entry.submitted) {
                    entry.submitted = pr.created_at.split('T')[0];
                  }
                  entries.push(entry);
                  console.log('Added staged entry: ' + entry.name);
                } catch (e) {
                  console.error('Could not parse ' + file.filename + ': ' + e.message);
                }
              }
            }

            entries.sort((a, b) => {
              const da = a.submitted ? new Date(a.submitted) : new Date();
              const db = b.submitted ? new Date(b.submitted) : new Date();
              // Sort by days remaining ascending (oldest submission first)
              return da - db;
            });

            fs.writeFileSync('site/staged.json', JSON.stringify(entries, null, 2));
            console.log('staged.json built with ' + entries.length + ' entries');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Commit staged catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/staged.json
          git diff --staged --quiet || git commit -m "Rebuild staged catalog from open PRs [bot]"
          git push

      - name: Setup Pages
        if: github.event_name == 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Accept submissions and build on push to main ─────────────────────────
  accept-submissions:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Move validated submissions to registry
        id: move
        run: |
          MOVED=0
          for file in submissions/*.json; do
            [ -f "$file" ] || continue
            UUID=$(basename "$file" .json)
            TODAY=$(date -u +%Y-%m-%d)
            jq \
              --arg date "$TODAY" \
              '.registered = $date | if .maturity then .status_changed = $date else . end' \
              "$file" > "registry/$UUID.json"
            rm "$file"
            MOVED=$((MOVED + 1))
            echo "Accepted: $UUID"
          done
          echo "moved=$MOVED" >> $GITHUB_OUTPUT

      - name: Commit accepted entries
        if: steps.move.outputs.moved != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/ submissions/
          git commit -m "Accept submitted conventions [bot]"
          git push

  build-catalogs:
    needs: accept-submissions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build registry catalog
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          function loadDir(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir)
              .filter(f => f.endsWith('.json'))
              .map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')));
          }

          // ── Registry catalog (accepted, non-deprecated) ──
          const all = loadDir('registry');
          const usedBy = {};
          all.forEach(e => {
            (e.composes || []).forEach(uuid => {
              if (!usedBy[uuid]) usedBy[uuid] = [];
              usedBy[uuid].push(e.uuid);
            });
          });
          const registered = all
            .filter(e => e.maturity !== 'deprecated')
            .map(e => ({ ...e, used_by: usedBy[e.uuid] || [] }))
            .sort((a, b) => (a.registered || '').localeCompare(b.registered || ''));
          fs.writeFileSync('site/catalog.json', JSON.stringify(registered, null, 2));
          console.log('catalog.json: ' + registered.length + ' entries');

          // ── Deprecated catalog ──
          const deprecated = all
            .filter(e => e.maturity === 'deprecated')
            .map(e => ({ ...e, used_by: usedBy[e.uuid] || [] }))
            .sort((a, b) => (a.status_changed || '').localeCompare(b.status_changed || ''));
          fs.writeFileSync('site/deprecated.json', JSON.stringify(deprecated, null, 2));
          console.log('deprecated.json: ' + deprecated.length + ' entries');
          "

      - name: Build search index
        run: |
          node -e "
          const fs = require('fs');
          const catalog = JSON.parse(fs.readFileSync('site/catalog.json', 'utf8'));
          const index = catalog.map(e => ({
            uuid: e.uuid,
            name: e.name,
            namespace_key: e.namespace ? e.namespace.key : '',
            title: e.title || '',
            description: e.description,
            tags: (e.tags || []).join(' '),
            maturity: e.maturity || '',
            maintainers: (e.maintainers || []).join(' ')
          }));
          fs.writeFileSync('site/assets/search-index.json', JSON.stringify(index, null, 2));
          console.log('search-index.json: ' + index.length + ' entries');
          "

      - name: Commit built site artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/catalog.json site/deprecated.json site/assets/search-index.json
          git diff --staged --quiet || git commit -m "Rebuild catalogs and search index [bot]"
          git push

  deploy-pages:
    needs: build-catalogs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
